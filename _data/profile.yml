short_bio: >-
  <p>
    Hi, guys👋! I'm Siqi Fu (符思琦)😊 , currently a first-year Ph.D. student in Computer Science and Technology at Hangzhou Dianzi University, supervised by Prof. <a href="https://sunseaiu.github.io/" target="_blank">Yong Peng</a>. Previously, I received my M.Eng. degree in Computer Technology from Yantai University, where I was advised by Prof. <a href="https://drpengsong.github.io/" target="_blank">Peng Song</a>.
  </p>
  <p>
    My current research focuses on EEG-based brain-computer interfaces🧠, with a broader interest in neural signal processing and brain-inspired computing. Previously, my work centered on speech and multimodal emotion recognition.
  </p>
  <p>
    During my leisure time, I am interested in movies🎞️, music🎧️, photography📷️, and various sports🏃‍♀️~
  </p>

